name: ccflowr
channels:
  - conda-forge
dependencies:
  # R base and package development
  - r-base>=4.2
  - r-remotes
  - r-devtools
  - r-roxygen2
  - r-testthat>=3.0.0

  # ccflowR runtime dependencies
  - r-r6
  - r-plotly
  - r-dplyr
  - r-tidyr
  - r-jsonlite
  - r-htmlwidgets

  # RStudio/R Markdown and Jupyter tutorial support
  - r-knitr
  - r-rmarkdown
  - r-irkernel
  - r-irdisplay
  - r-repr
  - jupyter
  - nbconvert

  # Static image export through reticulate + Kaleido
  - r-reticulate
  - python>=3.9,<3.13
  - pip
  - pip:
      - "plotly"
      - "kaleido<1.0"
